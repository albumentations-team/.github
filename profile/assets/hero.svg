<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title description">
  <title id="title">Albumentations</title>
  <description id="description">Open-source image augmentation ecosystem for computer vision</description>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b168f"/>
      <stop offset="0.55" stop-color="#5b2fc4"/>
      <stop offset="1" stop-color="#1267d7"/>
    </linearGradient>
    <linearGradient id="image" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffcb57"/>
      <stop offset="0.48" stop-color="#ff7b72"/>
      <stop offset="1" stop-color="#7ee787"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#160a42" flood-opacity="0.35"/>
    </filter>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
    </pattern>
  </defs>

  <rect width="1280" height="360" rx="28" fill="url(#background)"/>
