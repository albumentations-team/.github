    <text x="72" y="146" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="64" font-weight="750" letter-spacing="-2">Albumentations</text>
    <text x="76" y="198" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="25" font-weight="500" opacity="0.9">Open-source image augmentation ecosystem</text>
    <text x="76" y="236" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="25" font-weight="500" opacity="0.9">for computer vision</text>
  </g>

