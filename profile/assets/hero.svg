    <circle cx="117" cy="58" r="7" fill="#ffffff"/>
    <circle cx="219" cy="58" r="7" fill="#ffffff"/>
    <circle cx="117" cy="166" r="7" fill="#ffffff"/>
    <circle cx="219" cy="166" r="7" fill="#ffffff"/>
